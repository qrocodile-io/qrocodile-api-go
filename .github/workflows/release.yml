name: Release

# Version tags only. `git tag vX.Y.Z && git push --tags` is the entire release process — see
# CONTRIBUTING.md's "Releasing" section. Unlike npm, a Go module needs no publish step: `go get`
# resolves straight from the tag via the module proxy. This workflow only adds the optional,
# non-essential part — a GitHub release page with notes, so the tag has somewhere to point.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Only to create the release itself.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # tools/go.mod, not go.mod: this job runs `make check`, which needs golangci-lint. See
      # ci.yml and CONTRIBUTING.md's Tooling section for why the two floors differ.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Strip the leading "v" from the tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Re-run the full suite against the exact commit being released, the same "belt and
      # braces" reasoning qrocodile-api-node's publish.yml uses: CI's own push trigger only
      # fires on branch pushes, not tag pushes, so this is not otherwise guaranteed to have run
      # against this commit.
      - run: make check
        env:
          QR_API_KEY: ${{ secrets.QR_API_KEY }}
          QR_API_INTEGRATION_REQUIRED: true

      # Deliberately before creating the release. A version with nothing written about it
      # should stop here while the tag can still be safely moved — see
      # cmd/changelog-section's own message for why moving it is safe at this point.
      - name: Take the release notes from the changelog
        run: go run ./cmd/changelog-section "$version" > "$RUNNER_TEMP/release-notes.md"

      # Idempotent: a rerun after a previous success (e.g. retrying a failed later step) should
      # not fail just because the release already exists.
      - name: Create the GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving it alone."
          else
            case "$version" in
              *-*) FLAGS=--prerelease ;;
              *)   FLAGS= ;;
            esac
            # --verify-tag: without it a mistyped tag name is not an error, it is a brand new
            # tag created at the default branch plus a release announcing a version that does
            # not exist.
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag $FLAGS
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### $GITHUB_REF_NAME"
            echo ""
            echo "\`go get github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}\`"
            echo ""
            echo "- $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
